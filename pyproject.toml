[project]
name = "library-claim-agent"
version = "0.1.0"
description = "Live voice+vision agent that inventories, measures and prices a home library"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=1.40",
    "httpx>=0.27",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "python-dotenv>=1.0",
    "modal>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
